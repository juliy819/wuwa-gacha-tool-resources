name: Resource snapshot

on:
  schedule: [ { cron: '23 3 * * *' } ]
  workflow_dispatch:

permissions: { contents: write }

concurrency:
  group: resource-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: snapshot
        name: Build and compare snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_DATE=$(date -u +%Y.%m.%d)
          node scripts/build.mjs "$RELEASE_DATE" | tee build-output.json
          CATALOG_SHA=$(node -e "const fs=require('fs'), crypto=require('crypto'); process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync('resource-pack/catalog.json')).digest('hex'))")
          RELEASE_TAG="resources-${RELEASE_DATE}-${CATALOG_SHA:0:8}"
          echo "catalog_sha256=${CATALOG_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          HTTP_STATUS=$(curl --silent --show-error \
            --output latest-release.json \
            --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")

          if [[ "$HTTP_STATUS" == '404' ]]; then
            echo 'No existing release found; publishing the initial snapshot.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$HTTP_STATUS" != '200' ]]; then
            echo "Failed to read the latest release (HTTP ${HTTP_STATUS}); refusing to publish." >&2
            cat latest-release.json >&2
            exit 1
          fi

          MANIFEST_ASSET_URL=$(jq -er \
            '.assets[] | select(.name == "resource-manifest.json") | .url' \
            latest-release.json | head -n 1)
          curl --fail --location --silent --show-error \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$MANIFEST_ASSET_URL" \
            --output current-resource-manifest.json
          CURRENT_SHA=$(jq -er \
            '.catalog_sha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' \
            current-resource-manifest.json)

          if [[ "$CURRENT_SHA" == "$CATALOG_SHA" ]]; then
            echo "No resource changes detected (catalog SHA-256: $CATALOG_SHA)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Resource changes detected; publishing snapshot (catalog SHA-256: $CATALOG_SHA)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop when resources are unchanged
        if: steps.snapshot.outputs.changed != 'true'
        run: echo 'Resource snapshot is unchanged; no release will be created.'
      - name: Archive snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: zip -qr resource-pack.zip resource-pack
      - name: Generate manifest
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          sha256sum resource-pack.zip > resource-pack.sha256
          SIZE=$(stat -c%s resource-pack.zip)
          HASH=$(cut -d' ' -f1 resource-pack.sha256)
          RELEASE_TAG='${{ steps.snapshot.outputs.release_tag }}'
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/resource-pack.zip"
          CATALOG_SHA='${{ steps.snapshot.outputs.catalog_sha256 }}'
          jq -n --arg url "$URL" --arg sha "$HASH" --arg catalog_sha "$CATALOG_SHA" --argjson size "$SIZE" '{schema:1, archive_url:$url, archive_sha256:$sha, archive_size:$size, catalog_sha256:$catalog_sha}' > resource-manifest.json
      - uses: softprops/action-gh-release@v2
        if: steps.snapshot.outputs.changed == 'true'
        with:
          tag_name: ${{ steps.snapshot.outputs.release_tag }}
          name: Resource snapshot ${{ steps.snapshot.outputs.release_tag }}
          prerelease: false
          make_latest: true
          files: |
            resource-pack.zip
            resource-manifest.json
            resource-pack.sha256
